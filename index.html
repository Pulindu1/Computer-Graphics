<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACG Swarm Project - Base Scene</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101018;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 8px 10px;
        font:
          12px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        color: #eaeaea;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        user-select: none;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.126.1/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.126.1/examples/jsm/controls/OrbitControls.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div><b>Base Scene</b></div>
      <div>OrbitControls: LMB rotate, MMB zoom, RMB pan</div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
