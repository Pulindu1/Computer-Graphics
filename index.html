<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACG Swarm Project - Base Scene</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101018;
      }
      canvas {
        display: block;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        padding: 8px 10px;
        font:
          12px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        color: #eaeaea;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        user-select: none;
      }
      #fps {
        color: #0f0;
        font-family: monospace;
        font-size: 11px;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.126.1/build/three.module.js",
          "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.126.1/examples/jsm/controls/OrbitControls.js",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.17/dist/lil-gui.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <div><b>Base Scene</b></div>
      <div>OrbitControls: LMB rotate, MMB zoom, RMB pan</div>
      <div id="stats" style="margin-top: 4px; font-family: monospace; font-size: 10px; color: #0f0;">
        FPS: -- | Frame: --ms<br>
        Checks: -- | Pairs: -- | Cells: --
      </div>
    </div>

    <script type="module" src="./src/main.js?v=20260216"></script>
  </body>
</html>
